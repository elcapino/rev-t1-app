*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"AppFont",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#2a1f3d;color:#fff;font-size:17px;line-height:1.45;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
#app{min-height:100%;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));position:relative}
.ar{display:block;direction:rtl;unicode-bidi:isolate}
.en{display:block;direction:ltr;unicode-bidi:isolate;font-size:.82em;opacity:.78;font-weight:500}
.only .en{font-size:1em;opacity:1}
.auto{unicode-bidi:plaintext}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:18px;padding:10px 16px;font-weight:800;background:var(--accent);color:var(--onaccent);width:100%;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.small{min-height:44px;width:auto;margin:0;padding:6px 14px;font-size:.9em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.14);font-size:24px;flex:none;color:var(--fg)}
.h1{font-size:1.5em;font-weight:900;line-height:1.2}
.h2{font-size:1.15em;font-weight:800}
.muted{opacity:.75}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.16);font-weight:800;font-size:.9em;direction:ltr}
/* themes */
body{--bg:#2a1f3d;--fg:#fff;--card:#fff;--ink:#2a1f3d;--accent:#ffd23f;--onaccent:#2a1f3d;--line:rgba(255,255,255,.35);--soft:#f4effa;--ok:#22c55e;--bad:#ef4444}
body.t-pitch{--bg:#2a0f4f;--accent:#ffd23f;--onaccent:#2a0f4f;--soft:#f1eafc;background:radial-gradient(circle at 90% -10%,#7a3fc4 0,transparent 45%),linear-gradient(170deg,#2a0f4f,#1d0b38) fixed}
body.t-pastel{--bg:#fbf6f1;--fg:#3a2f45;--card:#fff;--ink:#3a2f45;--accent:#b07fd6;--onaccent:#fff;--line:#d9c8ea;--soft:#f6f0fd;background:linear-gradient(165deg,#fdf8f3,#f4ecfb 55%,#eaf8f2) fixed;color:#3a2f45}
body.t-pastel .back{background:#efe6f8}
body.t-pastel .pill{background:#efe6f8}
body.t-pond{--bg:#e3f6ff;--fg:#1b3a4b;--card:#fff;--ink:#1b3a4b;--accent:#ff8fab;--onaccent:#fff;--line:#9fd8f0;--soft:#fff8e1;background:linear-gradient(180deg,#bfe9ff,#e9fbff 60%,#fff6d6) fixed;color:#1b3a4b}
body.t-pond .back,body.t-pond .pill{background:#fff}
body.t-home{background:linear-gradient(160deg,#2a1f3d,#3b2a5e 60%,#1f3b4d) fixed}
/* home */
.kid{display:flex;align-items:center;gap:14px;border-radius:26px;padding:14px;margin:14px 0;min-height:110px;width:100%;text-align:start;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.kid .av{width:84px;height:84px;flex:none}
.kid.pitch{background:linear-gradient(135deg,#5b2d9e,#2a0f4f);color:#fff;border:3px solid #ffd23f}
.kid.pastel{background:linear-gradient(135deg,#f6eefe,#e5f7ef);color:#3a2f45;border:3px solid #d9c8ea}
.kid.pond{background:linear-gradient(135deg,#bfe9ff,#fff3c4);color:#1b3a4b;border:3px solid #fff}
.kname{font-size:1.35em;font-weight:900;line-height:1.15}
/* dashboard */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.count{display:flex;align-items:center;gap:14px}
.bignum{font-size:2.6em;font-weight:900;line-height:1;color:var(--accent);min-width:70px;text-align:center;direction:ltr}
body.t-pastel .bignum{color:#7a4fb0}
.mission{border:3px dashed var(--accent)}
.dad{font-weight:700;border-radius:18px;padding:10px 14px;background:rgba(255,255,255,.12);margin:10px 0}
body.t-pastel .dad,body.t-pond .dad{background:rgba(255,255,255,.75)}
.map{position:relative;padding:4px 0 10px}
.lv{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;border-radius:22px;padding:10px 14px;margin:10px 0;background:var(--card);color:var(--ink);text-align:start;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.t-pitch .lv:nth-child(odd){margin-inline-start:0;margin-inline-end:34px}
.t-pitch .lv:nth-child(even){margin-inline-start:34px;margin-inline-end:0;width:calc(100% - 34px)}
.t-pitch .lv:nth-child(odd){width:calc(100% - 34px)}
.lv .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--soft);flex:none}
.lv.locked{opacity:.55}
.lv.next{outline:4px solid var(--accent)}
.lv .stars{color:#f5b700;font-size:1.05em;letter-spacing:1px;direction:ltr;white-space:nowrap}
.lvtag{font-size:.72em;font-weight:900;background:#2a0f4f;color:#ffd23f;border-radius:8px;padding:1px 7px;direction:ltr;display:inline-block}
.t-pastel .lvtag{background:#efe6f8;color:#7a4fb0}
.done{font-size:.75em;font-weight:800;color:#15803d}
/* subject */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{min-height:96px;border-radius:20px;background:var(--card);color:var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.game .e{font-size:30px;line-height:1.1}
.game.wide{grid-column:1/-1;flex-direction:row;gap:12px;min-height:76px;background:var(--accent);color:var(--onaccent)}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.14);border-radius:16px;padding:5px;margin:8px 0}
.t-pastel .seg{background:#efe6f8}
.seg button{flex:1;min-height:46px;border-radius:12px;font-weight:800}
.seg button.on{background:var(--accent);color:var(--onaccent)}
/* explain cards */
.ex svg{width:100%;height:auto;display:block;border-radius:16px;background:#fff}
.ex svg text{font-family:"AppFont",system-ui,sans-serif}
.ex .h2{margin-top:12px}
.ex p{margin-top:6px}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:26px;border-radius:6px}
/* play */
.bar{height:12px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;flex:1}
.t-pastel .bar,.t-pond .bar{background:#e8e0f0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.q{font-size:1.18em;font-weight:800;line-height:1.4}
.q .en{font-size:.78em}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{min-height:60px;border-radius:18px;padding:10px 14px;background:var(--soft);color:var(--ink);font-weight:800;text-align:center;border:3px solid transparent;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{background:#dcfce7;border-color:var(--ok)}
.opt.bad{background:#fee2e2;border-color:var(--bad)}
.opt.dim{opacity:.45}
.tfrow{display:flex;gap:10px}
.tfrow .opt{flex:1;font-size:1.15em;min-height:80px}
.why{margin-top:14px;border-radius:18px;padding:12px 14px;background:#fff7e0;color:#4a3b00;font-weight:600;border-inline-start:6px solid #ffb703}
.why.good{background:#e8fbef;color:#14532d;border-color:#22c55e}
.why b{display:block;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{min-height:64px;border-radius:16px;padding:8px;background:var(--soft);color:var(--ink);font-weight:800;font-size:.92em;border:3px solid transparent;text-align:center}
.mi.sel{border-color:var(--accent);background:#fff3c4}
.t-pastel .mi.sel{background:#f3e8ff}
.mi.ok{background:#dcfce7;border-color:var(--ok);opacity:.75}
.mi.shake,.opt.shake,.tile.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots{min-height:70px;border-radius:18px;border:3px dashed var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip{min-height:54px;border-radius:14px;padding:8px 12px;background:var(--soft);color:var(--ink);font-weight:800;display:flex;align-items:center;gap:10px;text-align:start;width:100%}
.chip .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.9em}
.pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip.ok{background:#dcfce7}.chip.bad{background:#fee2e2}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);text-align:center;padding:0 6px}
.timer{font-size:1.4em;font-weight:900;direction:ltr;min-width:64px;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tiles.n2{grid-template-columns:1fr 1fr}
.tile{min-height:130px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#1b3a4b;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12);padding:8px;text-align:center;line-height:1.2}
.tile.txt{font-size:24px}
.tile svg{width:100%;max-height:150px}
.tile.ok{border-color:var(--ok);background:#e8fbef}
.tile.dim{opacity:.4}
.img svg{width:100%;height:auto;border-radius:18px;display:block}
/* end */
.starsbig{color:#f5b700;text-shadow:0 2px 0 rgba(0,0,0,.12);font-size:3.2em;text-align:center;letter-spacing:6px;direction:ltr}
.center{text-align:center}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{border-radius:16px;padding:8px 10px;background:var(--soft);color:var(--ink);font-weight:800;font-size:.85em;display:flex;align-items:center;gap:6px}
.badge.off{opacity:.35;filter:grayscale(1)}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog .bar{background:#eee}
/* sheets & toasts */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet .in{background:#fff;color:#2a1f3d;width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .btn.ghost{color:#2a1f3d;border-color:#d9c8ea}
.field{width:100%;min-height:54px;border-radius:14px;border:2px solid #d9c8ea;padding:8px 12px;margin-top:8px;font-size:1.05em;background:#fff;color:#2a1f3d;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;z-index:40;animation:pop .25s;max-width:92vw;text-align:center}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.goal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:35;pointer-events:none;font-size:56px;font-weight:900;color:#ffd23f;text-shadow:0 4px 0 #2a0f4f;animation:goal 1s ease-out forwards}
@keyframes goal{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.lockic{font-size:64px;text-align:center;margin:30px 0 10px}
.small{font-size:.82em}
.ver{font-size:.78em;opacity:.7;text-align:center;margin-top:18px;direction:ltr}
.nw li{margin:6px 0 6px 0;list-style:none;padding:8px 12px;border-radius:12px;background:#f4effa}
.hidden{display:none!important}
</style>

<body class="t-home">
<div id="app"></div>
<input id="file" type="file" accept=".json,.enc,application/json,text/plain" class="hidden">
<script>
"use strict";
const CONFIG = {"mode": "site", "remoteUrl": "pack.enc"};
const BUILTIN = null;
// CONFIG.mode: "local" (pack built in, offline file) | "site" (public shell; encrypted pack fetched from CONFIG.remoteUrl)
// To enable online updates in a local build, set remoteUrl to the hosted pack.enc URL in build_pack.py (see CONTENT_SCHEMA.md).
const LS = {state:"rt1.state", pack:"rt1.pack", key:"rt1.key"};
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast("⚠️ التخزين ممتلئ · Storage full"); return false; } }

let S = load(LS.state, null) || {lang:"both", names:{}, setup:false, prog:{}};
let PACK = null;

// ---------- language helpers ----------
function pair(x){ if (x == null) return ["",""]; return Array.isArray(x) ? [x[0], x[1]] : [x, x]; }
function T(x){ const [a,e] = pair(x); return S.lang === "en" ? e : a; }        // plain text
function H(x){                                                                   // html, both lines when lang=both
  const [a,e] = pair(x);
  if (a === e) return `<span class="auto" dir="auto">${esc(a)}</span>`;
  if (S.lang === "ar") return `<span dir="rtl">${esc(a)}</span>`;
  if (S.lang === "en") return `<span dir="ltr">${esc(e)}</span>`;
  return `<span class="ar">${esc(a)}</span><span class="en">${esc(e)}</span>`;
}
const UI = {
  pick:["اختار مين بيلعب","Who's playing?"], update:["تحديث","Update"], settings:["الإعدادات","Settings"],
  next:["التالي","Next"], check:["تأكد","Check"], again:["مرة ثانية","Play again"], back:["رجوع","Back"],
  understand:["افهمها","Understand it"], play:["العب","Play"], mission:["مهمة اليوم","Today's mission"],
  suggestion:["اقتراح اليوم (والقرار لج)","Today's suggestion (your call)"], progress:["تقدّمي","My progress"],
  start:["ابدأ","Start"], why:["ليش؟","Why?"], correct:["صح ✔","Correct ✔"], answer:["الجواب","Answer"],
  daysLeft:["أيام باقية على الامتحان","days to go"], today:["اليوم! بالتوفيق 🤲","Today! Good luck 🤲"], tomorrow:["باكر","Tomorrow"],
  allDone:["خلصت امتحانات الفصل الأول 🎉","Term 1 exams are done 🎉"], nextExam:["الامتحان الجاي","Next exam"],
  locked:["مقفل: خلّص اللي قبله","Locked: finish the one before"], done:["✔ خلص الامتحان","✔ Exam done"],
  len:["طول الجولة","Round length"], quick:["سريعة 5","Quick 5"], std:["عادية 10","Standard 10"], full:["كاملة","Full set"],
  got:["فهمتها ✔","Got it ✔"], score:["النتيجة","Score"], review:["راجع الأفكار هذي","Ideas to review"],
};
const GAMES = {
  mix:["⚽","جولة منوعة","Mixed round"], mcq:["🔤","اختيار من متعدد","Multiple choice"], tf:["✅","صح ولا خطأ","True or false"],
  match:["🔗","وصّل","Match pairs"], order:["🔢","رتّب","Put in order"], gap:["✏️","كمّل الفراغ","Fill the gap"],
  rid:["🧩","ألغاز","Riddles"], clock:["⏱️","سباق الوقت","Beat the clock"], pick:["🌟","العبي","Play"],
};
const BADGES = {
  first:["🥇","أول خطوة","First step"], streak3:["🔥","3 أيام ورا بعض","3-day streak"], streak7:["🌟","7 أيام ورا بعض","7-day streak"],
  star3:["⭐","أول 3 نجوم","First 3 stars"], five:["🏅","5 مواد","5 subjects"], all:["🏆","كل المواد","All subjects"],
  clock10:["⚡","سريع البرق","Lightning (10+)"], perfect:["💯","جولة كاملة","Perfect round"], cards:["💡","فهّيم","Understander"],
};

// ---------- dates ----------
function todayStr(){ const q = new URLSearchParams(location.search).get("today"); if (q) return q;
  const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dnum(s){ const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; }
const WD = [["الأحد","Sun"],["الاثنين","Mon"],["الثلاثاء","Tue"],["الأربعاء","Wed"],["الخميس","Thu"],["الجمعة","Fri"],["السبت","Sat"]];
const MO = [["يناير","Jan"],["فبراير","Feb"],["مارس","Mar"],["أبريل","Apr"],["مايو","May"],["يونيو","Jun"],["يوليو","Jul"],["أغسطس","Aug"],["سبتمبر","Sep"],["أكتوبر","Oct"],["نوفمبر","Nov"],["ديسمبر","Dec"]];
function fmtDate(s){ const [y,m,d] = s.split("-").map(Number); const w = new Date(Date.UTC(y,m-1,d)).getUTCDay();
  return [`${WD[w][0]} ${d} ${MO[m-1][0]}`, `${WD[w][1]} ${d} ${MO[m-1][1]}`]; }

// ---------- progress ----------
function P(cid){ S.prog[cid] = S.prog[cid] || {xp:0, streak:0, last:null, badges:[], s:{}}; return S.prog[cid]; }
function SP(cid, sid){ const p = P(cid); p.s[sid] = p.s[sid] || {stars:0, best:0, plays:0, cards:false, ok:{}}; return p.s[sid]; }
function persist(){ save(LS.state, S); }
function touchStreak(cid){ const p = P(cid), t = todayStr();
  if (p.last === t) return; p.streak = (p.last && dnum(t) - dnum(p.last) === 1) ? p.streak + 1 : 1; p.last = t; }
function award(cid, b){ const p = P(cid); if (!p.badges.includes(b)) { p.badges.push(b); return true; } return false; }
function checkBadges(cid, ctx){
  const p = P(cid), ch = child(cid), got = [];
  const add = b => { if (award(cid, b)) got.push(b); };
  add("first");
  if (p.streak >= 3) add("streak3"); if (p.streak >= 7) add("streak7");
  const st = ch.subjects.map(s => SP(cid, s.id).stars);
  if (st.some(x => x >= 3)) add("star3");
  if (st.filter(x => x >= 1).length >= 5) add("five");
  if (st.every(x => x >= 1)) add("all");
  if (ctx && ctx.clock >= 10) add("clock10");
  if (ctx && ctx.perfect) add("perfect");
  if (ch.subjects.filter(s => SP(cid, s.id).cards).length >= 3) add("cards");
  return got;
}

// ---------- pack handling ----------
function child(cid){ return PACK.children.find(c => c.id === cid); }
function subject(cid, sid){ return child(cid).subjects.find(s => s.id === sid); }
function mergePatch(base, patch){
  const out = JSON.parse(JSON.stringify(base));
  for (const pc of (patch.children || [])) {
    const ch = out.children.find(c => c.id === pc.id); if (!ch) { out.children.push(pc); continue; }
    for (const k of Object.keys(pc)) if (k !== "subjects" && k !== "id") ch[k] = pc[k];
    for (const ps of (pc.subjects || [])) {
      const cur = ch.subjects.find(s => s.id === ps.id);
      if (!cur) { ch.subjects.push(ps); continue; }
      for (const k of Object.keys(ps)) {
        if (k === "cards" || k === "qs") {
          cur[k] = cur[k] || [];
          for (const it of ps[k]) { const i = cur[k].findIndex(x => x.id === it.id); if (i >= 0) cur[k][i] = it; else cur[k].push(it); }
        } else if (k !== "id") cur[k] = ps[k];
      }
    }
    ch.subjects.sort((a,b) => (a.date||"9999").localeCompare(b.date||"9999"));
  }
  for (const id of (patch.remove || [])) for (const ch of out.children) for (const s of ch.subjects) s.qs = (s.qs||[]).filter(q => q.id !== id);
  out.version = patch.version; out.date = patch.date; out.whats_new = patch.whats_new || [];
  return out;
}
function applyPack(np, silent){
  if (!np || np.format !== "rt1-pack") throw new Error("not a pack");
  if (PACK && np.version <= PACK.version) { if (!silent) toast(S.lang==="en" ? "You already have this version ✔" : "عندك آخر نسخة ✔"); return false; }
  PACK = (np.kind === "patch" && PACK) ? mergePatch(PACK, np) : np;
  save(LS.pack, PACK);
  if (!silent) showWhatsNew();
  return true;
}
// ---------- crypto (AES-GCM, PBKDF2-SHA256) ----------
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
function hasCrypto(){ return !!(window.crypto && crypto.subtle); }
async function deriveKey(pass, env){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64d(env.salt), iterations:env.iter},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  return {raw: b64e(await crypto.subtle.exportKey("raw", key)), salt: env.salt};
}
async function decryptEnv(env, k){
  const key = await crypto.subtle.importKey("raw", b64d(k.raw), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(env.iv)}, key, b64d(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function openEnvelope(env, askIfNeeded){
  if (!hasCrypto()) throw new Error("nocrypto");
  let k = load(LS.key, null);
  if (k && k.salt === env.salt) { try { return await decryptEnv(env, k); } catch(e) {} }
  if (!askIfNeeded) throw new Error("needkey");
  const pass = await askPass(); if (!pass) throw new Error("cancel");
  k = await deriveKey(pass, env);
  const out = await decryptEnv(env, k).catch(() => { throw new Error("badpass"); });
  save(LS.key, k); return out;
}
async function ingestText(text){
  let o; try { o = JSON.parse(text); } catch(e) { throw new Error("notjson"); }
  if (o.format === "rt1-enc") o = await openEnvelope(o, true);
  return applyPack(o);
}
async function updateOnline(){
  if (!CONFIG.remoteUrl) return;
  toast(S.lang==="en" ? "Checking…" : "أدوّر على تحديث…");
  try {
    const r = await fetch(CONFIG.remoteUrl + "?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("http");
    await ingestText(await r.text()); render();
  } catch(e) { errToast(e); }
}
function errToast(e){
  const m = {badpass:["الرمز غلط، جرّب مرة ثانية","Wrong passcode"], nocrypto:["المتصفح ما يدعم فك التشفير هني. افتح الرابط في كروم أو سفاري","This browser can't decrypt here; open the link in Chrome/Safari"],
    notjson:["الملف مب ملف تحديث","That file isn't an update file"], http:["ما قدرت أوصل للإنترنت. جرّب بعدين","Couldn't reach the internet"], cancel:["",""]}[e.message] || ["صار خطأ بسيط","Something went wrong"];
  if (m[0]) toast(T(m));
}
function pickFile(){ const f = $("#file"); f.value = ""; f.onchange = async () => {
  const file = f.files[0]; if (!file) return;
  try { await ingestText(await file.text()); render(); } catch(e) { errToast(e); } }; f.click(); }

// ---------- small UI ----------
function toast(msg){ document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function confetti(n){ const cs = ["#ffd23f","#7a3fc4","#2ecc71","#ff7aa2","#3a86ff","#ff8c00"];
  for (let i=0;i<(n||50);i++){ const c = document.createElement("i"); c.className = "conf"; c.style.left = Math.random()*100+"vw";
    c.style.background = rnd(cs); c.style.animationDuration = (1.6+Math.random()*1.6)+"s"; c.style.animationDelay = Math.random()*.4+"s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800); } }
function bigWord(w){ const g = document.createElement("div"); g.className = "goal"; g.textContent = w; document.body.appendChild(g); setTimeout(() => g.remove(), 1000); }
function sheet(html, onMount){ const s = document.createElement("div"); s.className = "sheet"; s.innerHTML = `<div class="in">${html}</div>`;
  s.addEventListener("click", e => { if (e.target === s) s.remove(); }); document.body.appendChild(s); if (onMount) onMount(s); return s; }
function askPass(){ return new Promise(res => {
  const s = sheet(`<div class="h2">${H(["رمز العائلة","Family passcode"])}</div><p class="small muted">${H(["تكتبه مرة وحدة بس على هذا الجهاز.","You type it once on this device."])}</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" dir="ltr"><button class="btn" id="pwok">${H(["فتح","Unlock"])}</button>
    <button class="btn ghost" id="pwno">${H(["إلغاء","Cancel"])}</button>`);
  const done = v => { s.remove(); res(v); };
  s.querySelector("#pwok").onclick = () => done(s.querySelector("#pw").value.trim());
  s.querySelector("#pwno").onclick = () => done(null);
  s.querySelector("#pw").addEventListener("keydown", e => { if (e.key === "Enter") done(e.target.value.trim()); });
  setTimeout(() => s.querySelector("#pw").focus(), 50); }); }
function verLine(){ return PACK ? `${H(["نسخة المحتوى","Content version"])} ${PACK.date} · v${PACK.version}` : ""; }
function showWhatsNew(){
  const wn = (PACK.whats_new || []);
  const items = wn.length ? wn.map(w => `<li>✨ ${H([w[0], w[1]])}${w[2] ? ` <span class="small muted">· ${esc(dispName(w[2]))}</span>` : ""}</li>`).join("")
                          : `<li>${H(["المحتوى محدّث ✔","Content is up to date ✔"])}</li>`;
  sheet(`<div class="h2">🎁 ${H(["شو الجديد","What's new"])}</div><ul class="nw" style="margin-top:10px">${items}</ul>
    <p class="ver">${verLine()}</p><button class="btn" onclick="this.closest('.sheet').remove()">${H(["تمام","OK"])}</button>`);
}
function settings(){
  const s = sheet(`<div class="h2">⚙️ ${H(UI.settings)}</div>
   <div class="seg" style="background:#f4effa" id="lng">${[["both","ع + EN"],["ar","عربي"],["en","English"]].map(([k,l]) => `<button data-l="${k}" class="${S.lang===k?"on":""}">${l}</button>`).join("")}</div>
   <div class="h2" style="margin-top:12px">🔄 ${H(UI.update)}</div><p class="small muted">${verLine()}</p>
   ${CONFIG.remoteUrl ? `<button class="btn" id="uon">🌐 ${H(["تحديث من الإنترنت","Update from the internet"])}</button>` : ""}
   <button class="btn ${CONFIG.remoteUrl ? "ghost" : ""}" id="ufile">📁 ${H(["تحديث من ملف","Update from a file"])}</button>
   <button class="btn ghost" id="unew">🎁 ${H(["شو الجديد","What's new"])}</button>
   <div class="h2" style="margin-top:14px">✏️ ${H(["أسماء اللاعبين","Player names"])}</div>
   ${PACK.children.map(c => `<input class="field" data-c="${c.id}" placeholder="${esc(T(c.label))}" value="${esc(S.names[c.id]||"")}">`).join("")}
   <button class="btn" id="sv">${H(["حفظ","Save"])}</button>`);
  s.querySelectorAll("#lng button").forEach(b => b.onclick = () => { S.lang = b.dataset.l; persist(); s.remove(); render(); settings(); });
  if (CONFIG.remoteUrl) s.querySelector("#uon").onclick = () => { s.remove(); updateOnline(); };
  s.querySelector("#ufile").onclick = () => { s.remove(); pickFile(); };
  s.querySelector("#unew").onclick = () => { s.remove(); showWhatsNew(); };
  s.querySelector("#sv").onclick = () => { s.querySelectorAll("input[data-c]").forEach(i => S.names[i.dataset.c] = i.value.trim().slice(0,24)); persist(); s.remove(); render(); };
}
function dispName(cid){ const c = child(cid); return (S.names[cid] || "").trim() || (c ? T(c.label) : cid); }

// ---------- avatars ----------
const AV = {
  striker:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#ffd23f"/><path d="M22 92 q0 -30 28 -30 q28 0 28 30Z" fill="#7a3fc4"/><text x="50" y="88" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">10</text><circle cx="50" cy="40" r="18" fill="#c68642"/><path d="M32 36 q18 -22 36 0 q-4 -16 -18 -16 q-14 0 -18 16Z" fill="#222"/><circle cx="43" cy="41" r="2.4" fill="#222"/><circle cx="57" cy="41" r="2.4" fill="#222"/><path d="M44 49 q6 5 12 0" stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="80" cy="78" r="12" fill="#fff" stroke="#222" stroke-width="2"/><polygon points="80,72 85,76 83,82 77,82 75,76" fill="#222"/></svg>`,

// ---------- navigation ----------
let VIEW = {v:"home"}; const STACK = [];
function go(v){ STACK.push(VIEW); VIEW = v; try{ history.pushState({d:STACK.length}, ""); }catch(e){} render(); window.scrollTo(0,0); }
function backTo(){ if (TIMER) { clearInterval(TIMER); TIMER = null; } VIEW = STACK.pop() || {v:"home"}; render(); window.scrollTo(0,0); }
window.addEventListener("popstate", () => { document.querySelectorAll(".sheet").forEach(s => s.remove()); if (STACK.length) backTo(); });
function back(){ if (STACK.length) history.back(); else { VIEW = {v:"home"}; render(); } }
function topbar(title, extra){ return `<div class="top"><button class="back" onclick="back()" aria-label="back">${S.lang === "en" ? "←" : "→"}</button><div class="sp h2">${title}</div>${extra||""}</div>`; }

function render(){
  document.body.className = "t-home";
  document.documentElement.dir = S.lang === "en" ? "ltr" : "rtl"; document.documentElement.lang = S.lang === "en" ? "en" : "ar";
  if (!PACK) return renderLock();
  if (!S.setup) return renderSetup();
  const v = VIEW;
  if (v.v === "home") return renderHome();
  const ch = child(v.c); if (!ch) { VIEW = {v:"home"}; return renderHome(); }
  document.body.className = "t-" + ch.theme;
  if (v.v === "child") return renderChild(ch);
  if (v.v === "prog") return renderProgress(ch);
  const s = subject(v.c, v.s); if (!s) { VIEW = {v:"child", c:v.c}; return renderChild(ch); }
  if (v.v === "subj") return renderSubject(ch, s);
  if (v.v === "cards") return renderCards(ch, s);
  if (v.v === "play") return renderPlay(ch, s);
  if (v.v === "end") return renderEnd(ch, s);
}

// ---------- game engine ----------
let R = null, TIMER = null;
const QUICK = ["mcq","tf","gap","rid"];
function startRound(cid, sid, mode, replace){
  const ch = child(cid), s = subject(cid, sid), all = s.qs || [];
  let qs, len = ch.choice ? (VIEW.len || 10) : 8;
  if (mode === "mix") qs = shuffle(all).slice(0, len);
  else if (mode === "clock") qs = shuffle(all.filter(q => QUICK.includes(q.t)));
  else if (mode === "pick") qs = shuffle(all);
  else qs = shuffle(all.filter(q => q.t === mode)).slice(0, Math.max(len, 5));
  if (!qs.length) { toast("—"); return; }
  if (TIMER) { clearInterval(TIMER); TIMER = null; }
  R = {cid, sid, mode, qs, i:0, score:0, tries:0, wrong:[], left:60, st:null, pool:[], seq:[], mSel:null, mDone:0, mErr:0};
  touchStreak(cid);
  const v = {v:"play", c:cid, s:sid, len:VIEW.len};
  if (replace) { VIEW = v; render(); } else go(v);
  if (mode === "clock") TIMER = setInterval(() => { R.left--; const t = $("#tm"); if (t) t.textContent = R.left + "s";
    if (R.left <= 0) { clearInterval(TIMER); TIMER = null; finishRound(); } }, 1000);
}
function curQ(){ return R.qs[R.mode === "clock" ? R.i % R.qs.length : R.i]; }
function qText(q){ return H(q.q).replace(/___/g, '<span class="blank">؟</span>'); }
function renderPlay(ch, s){
  if (!R || R.sid !== s.id || R.cid !== ch.id) { back(); return; }
  const q = curQ(), n = R.qs.length, clock = R.mode === "clock";
  const head = clock
    ? `<div class="row" style="margin:6px 0 10px"><div class="timer" id="tm">${R.left}s</div><div class="sp"></div><span class="pill">✔ ${R.score}</span></div>`
    : `<div class="row" style="margin:6px 0 10px"><div class="bar"><i style="width:${Math.round(100*R.i/n)}%"></i></div><span class="small" style="direction:ltr">${R.i+1}/${n}</span></div>`;
  R.st = null;
  app.innerHTML = `${topbar(`${GAMES[clock ? "clock" : (R.mode === "mix" ? "mix" : q.t)][0]} ${H(s.name)}`)}${head}<div class="card" id="qc"></div>`;
  const box = $("#qc");
  if (q.t === "tf") {
    box.innerHTML = `<div class="small muted">${H(["صح ولا خطأ؟","True or false?"])}</div><div class="q">${qText(q)}</div>
      <div class="tfrow" style="margin-top:14px"><button class="opt" data-v="1">✅ ${H(["صح","True"])}</button><button class="opt" data-v="0">❌ ${H(["خطأ","False"])}</button></div><div id="fb"></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.v === "1" === q.a, b, box.querySelector(`.opt[data-v="${q.a ? 1 : 0}"]`)));
  } else if (["mcq","gap","rid"].includes(q.t)) {
    const idx = shuffle(q.o.map((_, k) => k));
    box.innerHTML = `${q.t === "rid" ? `<div class="small muted">🧩 ${H(["لغز","Riddle"])}</div>` : ""}<div class="q">${qText(q)}</div>
      <div class="opts">${idx.map(k => `<button class="opt" data-k="${k}">${H(q.o[k])}</button>`).join("")}</div><div id="fb"></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k === q.a, b, box.querySelector(`.opt[data-k="${q.a}"]`)));
  } else if (q.t === "match") {
    R.mSel = null; R.mDone = 0; R.mErr = 0;
    const L = shuffle(q.p.map((_, k) => k)), Rr = shuffle(q.p.map((_, k) => k));
    box.innerHTML = `<div class="q">${H(q.q)}</div><div class="small muted">${H(["اضغط على وحدة من اليمين ثم اللي تناسبها","Tap one on the right, then its partner"])}</div>
      <div class="mgrid"><div class="mcol">${L.map(k => `<button class="mi" data-side="l" data-k="${k}">${H(q.p[k][0])}</button>`).join("")}</div>
      <div class="mcol">${Rr.map(k => `<button class="mi" data-side="r" data-k="${k}">${H(q.p[k][1])}</button>`).join("")}</div></div><div id="fb"></div>`;
    box.querySelectorAll(".mi").forEach(b => b.onclick = () => matchTap(q, b));
  } else if (q.t === "order") {
    R.pool = shuffle(q.s.map((_, k) => k)); R.seq = [];
    box.innerHTML = `<div class="q">${H(q.q)}</div><div class="small muted">${H(["اضغط بالترتيب الصح","Tap them in the right order"])}</div><div class="slots" id="sl"></div><div class="pool" id="pl"></div><div id="ob"></div><div id="fb"></div>`;
    drawOrder(q);
  } else if (q.t === "pick") {
    const isSvg = x => /^\s*<svg/.test(x);
    box.innerHTML = `<div class="q center" style="font-size:1.35em">${H(q.q)}</div>${q.img ? `<div class="img" style="margin-top:10px">${q.img}</div>` : ""}
      <div class="tiles">${q.o.map((o, k) => `<button class="tile ${isSvg(o) ? "" : (o.length > 2 && !/\p{Extended_Pictographic}/u.test(o) ? "txt" : "")}" data-k="${k}" ${q.o.length === 3 && k === 2 ? 'style="grid-column:1/-1"' : ""}>${isSvg(o) ? o : esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
    box.querySelectorAll(".tile").forEach(b => b.onclick = () => pickTap(q, b));
  }
}
function voice(kind){ const ch = child(R.cid); return rnd((ch.voice && ch.voice[kind]) || [["",""]]); }
function cheer(){ const ch = child(R.cid); if (ch.theme === "pitch") bigWord("GOAL!"); else if (ch.theme === "pond") confetti(25); }
function markOk(q){ const sp = SP(R.cid, R.sid); if (q.id) sp.ok[q.id] = 1; }
function nextBtn(){ return `<button class="btn" id="nx">${H(R.i + 1 >= R.qs.length && R.mode !== "clock" ? ["النتيجة","See result"] : UI.next)}</button>`; }
function advance(){ R.i++; if (R.mode !== "clock" && R.i >= R.qs.length) return finishRound(); render(); }
function feedback(ok, q){
  const fb = $("#fb"), v = voice(ok ? "good" : "wrong");
  fb.innerHTML = ok ? `<div class="why good"><b>${H(v)}</b>${q.w ? H(q.w) : ""}</div>${nextBtn()}`
                    : `<div class="why"><b>${H(v)}</b>${H(q.w)}</div>${nextBtn()}`;
  $("#nx").onclick = advance;
  setTimeout(() => fb.scrollIntoView({behavior:"smooth", block:"nearest"}), 50);
}
function answer(ok, btn, right){
  if (R.st) return; R.st = "done";
  const q = curQ(); R.tries++;
  document.querySelectorAll("#qc .opt").forEach(b => b.classList.add("dim"));
  right.classList.remove("dim"); right.classList.add("ok");
  if (!ok) { btn.classList.remove("dim"); btn.classList.add("bad", "shake"); R.wrong.push(q); }
  else { R.score++; markOk(q); P(R.cid).xp += 10; }
  persist();
  if (R.mode === "clock") {
    if (ok) { setTimeout(advance, 450); }
    else { const fb = $("#fb"); fb.innerHTML = `<div class="why"><b>${H(UI.answer)}: ${H(q.t === "tf" ? (q.a ? ["صح","True"] : ["خطأ","False"]) : q.o[q.a])}</b>${H(q.w)}</div>`; setTimeout(advance, 2200); }
    return;
  }
  if (ok) cheer();
  feedback(ok, q);
}
function matchTap(q, b){
  if (b.classList.contains("ok") || R.st) return;
  if (b.dataset.side === "l") { document.querySelectorAll('#qc .mi[data-side="l"]').forEach(x => x.classList.remove("sel")); b.classList.add("sel"); R.mSel = b; return; }
  if (!R.mSel) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); return; }
  if (R.mSel.dataset.k === b.dataset.k) {
    R.mSel.classList.remove("sel"); R.mSel.classList.add("ok"); b.classList.add("ok"); R.mSel = null; R.mDone++;
    if (R.mDone === q.p.length) { R.st = "done"; R.tries++; const ok = R.mErr <= 1;
      if (ok) { R.score++; markOk(q); P(R.cid).xp += 10; cheer(); } else R.wrong.push(q); persist(); feedback(ok, q); }
  } else { R.mErr++; b.classList.add("shake"); R.mSel.classList.add("shake"); const a = R.mSel; setTimeout(() => { b.classList.remove("shake"); a.classList.remove("shake"); }, 400); }
}
function drawOrder(q){
  const sl = $("#sl"), pl = $("#pl");
  sl.innerHTML = R.seq.length ? R.seq.map((k, j) => `<button class="chip" data-j="${j}"><span class="n">${j+1}</span>${H(q.s[k])}</button>`).join("") : `<div class="small muted center" style="padding:14px">⬇️</div>`;
  pl.innerHTML = R.pool.map(k => `<button class="chip" data-k="${k}"><span class="n">+</span>${H(q.s[k])}</button>`).join("");
  sl.querySelectorAll(".chip").forEach(c => c.onclick = () => { if (R.st) return; const [k] = R.seq.splice(+c.dataset.j, 1); R.pool.push(k); drawOrder(q); });
  pl.querySelectorAll(".chip").forEach(c => c.onclick = () => { if (R.st) return; const k = +c.dataset.k; R.pool = R.pool.filter(x => x !== k); R.seq.push(k); drawOrder(q); });
  $("#ob").innerHTML = !R.pool.length && !R.st ? `<button class="btn" id="ck">${H(UI.check)}</button>` : "";
  if (!R.pool.length && !R.st) $("#ck").onclick = () => {
    R.st = "done"; R.tries++; const ok = R.seq.every((k, j) => k === j);
    sl.querySelectorAll(".chip").forEach((c, j) => c.classList.add(R.seq[j] === j ? "ok" : "bad"));
    $("#ob").innerHTML = ok ? "" : `<div class="small" style="margin-top:10px"><b>${H(["الترتيب الصح","Right order"])}:</b> ${q.s.map((x, j) => `<div>${j+1}. ${H(x)}</div>`).join("")}</div>`;
    if (ok) { R.score++; markOk(q); P(R.cid).xp += 10; cheer(); } else R.wrong.push(q);
    persist(); feedback(ok, q); };
}
function pickTap(q, b){
  if (R.st) return;
  if (+b.dataset.k === q.a) {
    R.st = "done"; b.classList.add("ok"); document.querySelectorAll("#qc .tile").forEach(t => { if (t !== b) t.classList.add("dim"); });
    if (!R.missed) { R.score++; markOk(q); } P(R.cid).xp += 5; persist(); confetti(30); R.missed = false;
    const fb = $("#fb"); fb.innerHTML = `<div class="why good"><b>${H(voice("good"))}</b>${H(q.w)}</div>${nextBtn()}`; $("#nx").onclick = advance;
  } else { R.missed = true; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400);
    $("#fb").innerHTML = `<div class="why"><b>${H(voice("wrong"))}</b></div>`; }
}
function finishRound(){
  if (TIMER) { clearInterval(TIMER); TIMER = null; }
  const ch = child(R.cid), sp = SP(R.cid, R.sid), clock = R.mode === "clock";
  const total = clock ? R.tries : R.qs.length, pct = total ? R.score / total : 0;
  const stars = clock ? (R.score >= 12 ? 3 : R.score >= 8 ? 2 : 1) : (pct >= .9 ? 3 : pct >= .7 ? 2 : 1);
  sp.stars = Math.max(sp.stars, stars); sp.best = Math.max(sp.best, clock ? 0 : Math.round(pct * 100)); sp.plays++;
  P(R.cid).xp += 5 * stars;
  const ctx = {clock: clock ? R.score : 0, perfect: !clock && R.score === total && total >= 5};
  R.res = {stars, total, newB: checkBadges(R.cid, ctx)}; persist();
  VIEW = {v:"end", c:R.cid, s:R.sid, len:VIEW.len}; render(); window.scrollTo(0,0);
  confetti(stars * 25); if (ch.theme === "pitch" && stars === 3) bigWord("🏆");
}
function renderEnd(ch, s){
  if (!R || !R.res) { back(); return; }
  const r = R.res, clock = R.mode === "clock";
  const seen = new Set(), rev = R.wrong.filter(q => !seen.has(q.id) && seen.add(q.id));
  app.innerHTML = `${topbar(`${s.icon} ${H(s.name)}`)}<div class="card center"><div class="starsbig">${starsTxt(r.stars)}</div>
    <div class="h1" style="margin-top:6px;direction:ltr">${R.score}${clock ? "" : " / " + r.total}</div>
    <div class="small muted">${clock ? H(["إجابات صح في 60 ثانية","right answers in 60 seconds"]) : H(UI.score)}</div>
    <div class="dad" style="background:var(--soft);margin-top:12px">${H(voice("end"))}</div>
    ${r.newB.length ? `<div class="badges" style="justify-content:center">${r.newB.map(b => `<span class="badge">${BADGES[b][0]} ${esc(T([BADGES[b][1], BADGES[b][2]]))}</span>`).join("")}</div>` : ""}</div>
   ${rev.length ? `<div class="card"><div class="h2">📌 ${H(UI.review)}</div>${rev.map(q => `<div class="why" style="margin-top:10px"><b>${q.t === "match" || q.t === "order" ? H(q.q) : qText(q)}</b>${H(q.w)}</div>`).join("")}</div>` : ""}
   <button class="btn" id="ag">🔁 ${H(UI.again)}</button><button class="btn ghost" onclick="back()">${H(UI.back)}</button>`;
  $("#ag").onclick = () => startRound(R.cid, R.sid, R.mode, true);
}

// ---------- boot ----------
(async function boot(){
  const stored = load(LS.pack, null);
  if (BUILTIN && stored && stored.format === "rt1-pack" && stored.version > BUILTIN.version) PACK = stored;
  else if (BUILTIN) PACK = BUILTIN;
  else if (stored && stored.format === "rt1-pack") PACK = stored;
  try { history.replaceState({d:0}, ""); } catch(e) {}
  render();
  // No automatic network calls: online updates only happen when the user taps «تحديث».
})();
</script>
</body>
